name: transvolt_em
description: Transvolt E&M Maintenance — ground operations register for site engineering staff.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Drives the real client in a real browser. CanvasKit paints to a canvas,
  # so the DOM carries no text and no DOM-based tool can see this app.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
