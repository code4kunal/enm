server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # go_router client-side routes — serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Flutter web bootstrap and entrypoint scripts must revalidate on every reload
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Static media and fonts can be cached short-term
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
