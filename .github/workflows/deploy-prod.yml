name: Deploy prod

# Push to main → CI → this workflow (only if CI succeeded).
# Manual: Actions → Deploy prod → Run workflow.
#
# Required repo secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Images are tagged with the git SHA only (no :latest). Task defs are updated
# to that digest/tag so ECS does not depend on a mutable latest pointer.
# SiteOps URLs stay as already configured on the live task defs (DEV).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 654654496534.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: prod-enterprise
  BACKEND_ECR: enm-backend
  FRONTEND_ECR: enm-frontend
  BACKEND_TASK_FAMILY: enm-backend
  FRONTEND_TASK_FAMILY: enm-frontend
  BACKEND_CONTAINER: enm-backend
  FRONTEND_CONTAINER: enm-frontend
  BACKEND_SERVICE: enm-prod-backend-service
  FRONTEND_SERVICE: enm-frontend-service

jobs:
  deploy:
    name: Build, push, ECS roll
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read

    steps:
      - name: Resolve commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend (SHA tag only)
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR }}
          TAG: ${{ steps.sha.outputs.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" backend
          docker push "$IMAGE:$TAG"
          echo "BACKEND_IMAGE=$IMAGE:$TAG" >> "$GITHUB_ENV"

      - name: Build and push frontend (SHA tag only)
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR }}
          TAG: ${{ steps.sha.outputs.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" app
          docker push "$IMAGE:$TAG"
          echo "FRONTEND_IMAGE=$IMAGE:$TAG" >> "$GITHUB_ENV"

      - name: Export current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_FAMILY" \
            --query taskDefinition \
            > backend-task-definition.json

      - name: Export current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FRONTEND_TASK_FAMILY" \
            --query taskDefinition \
            > frontend-task-definition.json

      - name: Render backend task definition with new image
        id: backend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: ${{ env.BACKEND_CONTAINER }}
          image: ${{ env.BACKEND_IMAGE }}

      - name: Render frontend task definition with new image
        id: frontend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: ${{ env.FRONTEND_CONTAINER }}
          image: ${{ env.FRONTEND_IMAGE }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
