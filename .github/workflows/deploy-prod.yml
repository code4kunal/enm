name: Deploy prod

# Push to main deploys immediately — no CI gate.
# Backend and frontend build/deploy in parallel and never block each other.
# Path filters skip the half that did not change.
#
# Required repo secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Images are tagged with the git SHA only (no :latest). Live task-def env
# (including SITEOPS_BASE_URL) is preserved; only the container image changes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which service(s) to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 654654496534.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: prod-enterprise

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'infra/ecs/task-definition-api.json'
              - 'infra/ecs/task-definition-combined.json'
              - '.github/workflows/deploy-prod.yml'
            frontend:
              - 'app/**'
              - 'infra/ecs/task-definition-web.json'
              - 'infra/ecs/task-definition-combined.json'
              - '.github/workflows/deploy-prod.yml'

      - name: Resolve targets
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
            case "$TARGET" in
              backend)  echo "backend=true"  >> "$GITHUB_OUTPUT"; echo "frontend=false" >> "$GITHUB_OUTPUT" ;;
              frontend) echo "backend=false" >> "$GITHUB_OUTPUT"; echo "frontend=true"  >> "$GITHUB_OUTPUT" ;;
              *)        echo "backend=true"  >> "$GITHUB_OUTPUT"; echo "frontend=true"  >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "backend=${{ steps.filter.outputs.backend }}"   >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-prod-backend
      cancel-in-progress: true
    env:
      ECR_REPO: enm-backend
      TASK_FAMILY: enm-backend
      CONTAINER_NAME: enm-backend
      ECS_SERVICE: enm-prod-backend-service
      BUILD_CONTEXT: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (SHA tag only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=enm-backend
          cache-to: type=gha,mode=max,scope=enm-backend

      - name: Export current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render task definition with new image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Don't block the workflow on full stability — image is live as soon
          # as the new task starts passing health checks.
          wait-for-service-stability: false

  frontend:
    name: Deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-prod-frontend
      cancel-in-progress: true
    env:
      ECR_REPO: enm-frontend
      TASK_FAMILY: enm-frontend
      CONTAINER_NAME: enm-frontend
      ECS_SERVICE: enm-frontend-service
      BUILD_CONTEXT: app
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (SHA tag only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=enm-frontend
          cache-to: type=gha,mode=max,scope=enm-frontend

      - name: Export current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render task definition with new image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
