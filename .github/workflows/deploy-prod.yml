name: Deploy prod

# Push to main → CI → this workflow (only if CI succeeded).
# Two deploy jobs — backend (backend/) and frontend (app/) — can run together
# or one at a time via workflow_dispatch.
#
# Required repo secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Images are tagged with the git SHA only (no :latest). Live task-def env
# (including DEV SiteOps URLs) is preserved; only the container image changes.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which service(s) to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend

concurrency:
  group: deploy-prod-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 654654496534.dkr.ecr.ap-south-1.amazonaws.com
  ECS_CLUSTER: prod-enterprise

jobs:
  setup:
    name: Resolve commit
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy_backend: ${{ steps.target.outputs.backend }}
      deploy_frontend: ${{ steps.target.outputs.frontend }}
    steps:
      - name: Resolve commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve targets
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          case "$TARGET" in
            backend)
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  backend:
    name: Deploy backend
    needs: setup
    if: needs.setup.outputs.deploy_backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ECR_REPO: enm-backend
      TASK_FAMILY: enm-backend
      CONTAINER_NAME: enm-backend
      ECS_SERVICE: enm-prod-backend-service
      DOCKER_CONTEXT: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (SHA tag only)
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}
          TAG: ${{ needs.setup.outputs.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" "$DOCKER_CONTEXT"
          docker push "$IMAGE:$TAG"
          echo "IMAGE_URI=$IMAGE:$TAG" >> "$GITHUB_ENV"

      - name: Export current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render task definition with new image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  frontend:
    name: Deploy frontend
    needs: setup
    if: needs.setup.outputs.deploy_frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ECR_REPO: enm-frontend
      TASK_FAMILY: enm-frontend
      CONTAINER_NAME: enm-frontend
      ECS_SERVICE: enm-frontend-service
      DOCKER_CONTEXT: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (SHA tag only)
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}
          TAG: ${{ needs.setup.outputs.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" "$DOCKER_CONTEXT"
          docker push "$IMAGE:$TAG"
          echo "IMAGE_URI=$IMAGE:$TAG" >> "$GITHUB_ENV"

      - name: Export current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render task definition with new image
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
