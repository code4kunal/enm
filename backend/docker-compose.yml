services:
  db:
    container_name: enm_db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enm
      POSTGRES_PASSWORD: enm
      POSTGRES_DB: enm
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enm -d enm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: enm_backend
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://enm:enm@db:5432/enm
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      # Explicit origins only — "*" + credentials is rejected by browsers.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8000,http://localhost:8008,http://localhost:8080,http://localhost:8089,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:8080,http://127.0.0.1:8089,http://127.0.0.1:5173}
      SITEOPS_BASE_URL: ${SITEOPS_BASE_URL:-https://dev-siteops-platform.transvolt.org/api/v1}
      # Server-side only — never passed to the `web` build args below.
      SITEOPS_SERVICE_KEY: ${SITEOPS_SERVICE_KEY:-}
      SEED_ON_START: ${SEED_ON_START:-true}
      BOOTSTRAP_SUPERADMIN_USER_ID: ${BOOTSTRAP_SUPERADMIN_USER_ID:-${BOOTSTRAP_USER_ID:-ADMIN}}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-${BOOTSTRAP_PASSWORD:-admin123}}
      BOOTSTRAP_SUPERADMIN_NAME: ${BOOTSTRAP_SUPERADMIN_NAME:-Super Admin}
      ENVIRONMENT: development
      # Microsoft SSO (leave blank to disable /auth/sso)
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      # FCM (leave blank to keep in-app notifications without push)
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    ports:
      - "8123:8000"
      - "8000:8000"
    volumes:
      - media:/srv/media
      - ./secrets:/srv/secrets:ro
      # Operator spreadsheets, for the one-off provisioning scripts. Read-only:
      # the running API never writes here, it ingests through the import API.
      - ../data:/srv/data:ro
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    container_name: enm_frontend
    build:
      context: ../app
    environment:
      # The browser calls this URL — NOT http://api:8000. Must be reachable
      # from the user's machine (localhost, dev host, or reverse proxy).
      # Read at container START by docker-entrypoint.sh, not baked into the
      # image — change these and `docker compose up -d web` picks it up,
      # no rebuild.
      API_BASE_URL: ${WEB_API_BASE_URL:-${API_PUBLIC_URL:-http://localhost:8123/api/v1}}
      SITEOPS_BASE_URL: ${SITEOPS_BASE_URL:-https://dev-siteops-platform.transvolt.org/api/v1}
      # production|prod + localhost API_BASE_URL refuses to start the container (see app/docker-entrypoint.sh)
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8089}:80"

volumes:
  pgdata:
  media:
