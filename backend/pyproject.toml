[project]
name = "enm-backend"
version = "1.0.0"
description = "Transvolt E&M Maintenance API"
requires-python = ">=3.11,<3.14"

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = [
    "B008",
    "E501",
    # `StrEnum(str, Enum)` rather than `enum.StrEnum`: the two differ in what
    # `str()` returns, and every enum on the wire is serialised through it.
    # Worth changing deliberately, not because a linter grew a new rule.
    "UP042",
    # PEP 695 type parameters are 3.12; this package supports 3.11.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["ARG", "I"]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
